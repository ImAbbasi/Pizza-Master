<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🍕Pizza Master | Official Order System</title>
<meta name="description" content="Order the best pizzas, burgers, and deals in Lodhran. Fast delivery and fresh taste!">
<meta name="theme-color" content="#800000">
<style>
:root {
    --red:#800000;
    --orange:#f37021;
    --bg:#fff9f5;
    --white:#ffffff;
    --green:#25D366;
    --fb-blue:#1877F2;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; outline:none; }
body { font-family:'Segoe UI',Roboto,sans-serif; background:var(--bg); margin:0; overflow-x:hidden; }

/* HEADER STICKY */
header {
    background: var(--red);
    color: white;
    padding: 15px;
    position: sticky;
    top: 0;
    z-index: 1005;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 4px solid var(--orange);
}
.header-logo-text { font-size: 24px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; font-family: 'Arial Black', sans-serif; }
.header-logo-text span { color: var(--orange); }

/* SEARCH STICKY */
.search-container { 
    background:white; 
    padding:10px 15px; 
    position:sticky; 
    top:62px; /* Adjusted to sit under header */
    z-index: 1004; 
    border-bottom:1px solid #eee; 
    display: flex; 
    gap: 10px;
}
.search-bar { flex-grow: 1; padding:12px 15px; border-radius:12px; border:1px solid #ddd; background:#f9f9f9; font-size:14px; }

/* CATEGORY SWIMLANE STICKY */
.category-scroll { 
    display:flex; 
    overflow-x:auto; 
    background:white; 
    white-space:nowrap; 
    border-bottom:1px solid #ddd; 
    padding:12px 5px; 
    position:sticky; 
    top:125px; /* Adjusted to sit under search */
    z-index:1003; 
    scrollbar-width: none; /* Hide scrollbar Firefox */
}
.category-scroll::-webkit-scrollbar { display: none; } /* Hide scrollbar Chrome/Safari */

.cat-tab { 
    padding:8px 20px; 
    margin:0 5px; 
    border-radius:20px; 
    font-size:13px; 
    font-weight:700; 
    color:#666; 
    background:#f0f0f0; 
    cursor:pointer; 
    transition: 0.3s;
    flex: 0 0 auto;
}
.cat-tab.active { background:var(--red); color:white; transform: scale(1.05); }

/* GATEWAY & GRID */
#gateway { position:fixed; top:0; left:0; width:100%; height:100%; background:#000; display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:2000; text-align:center; color:white; }
.logo-3d-main { width:220px; margin-bottom:20px; animation:logoFloat 3s ease-in-out infinite; }
@keyframes logoFloat { 0%{transform:translateY(0px);} 50%{transform:translateY(-12px);} 100%{transform:translateY(0px);} }
.logo-big { font-size:38px; font-weight:900; margin-bottom:30px; }
.logo-big span { color:var(--orange); }
.gate-btn { width:85%; max-width:300px; padding:18px; border-radius:50px; border:none; font-weight:800; cursor:pointer; margin-bottom:15px; transition:0.3s; }
#main-app { display:none; }

.container { padding:15px; max-width:600px; margin:auto; padding-bottom:120px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
.card { background:white; border-radius:15px; overflow:hidden; box-shadow:0 4px 10px rgba(0,0,0,0.05); text-align:center; border:1px solid #eee; display:flex; flex-direction:column; }
.card-img { width:100%; height:110px; object-fit:cover; }
.card-info { padding:10px; flex-grow:1; }
.card-name { font-weight:800; font-size:11px; margin-bottom:5px; color:#333; height:35px; overflow:hidden; }
.card-price { color:var(--orange); font-weight:900; font-size:12px; }

/* CART & MODALS */
#cart-bar { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:90%; max-width:400px; background:var(--red); color:white; padding:12px 20px; border-radius:50px; display:none; justify-content:space-between; align-items:center; z-index:1100; border: 2px solid var(--orange); }
.checkout-btn { background:var(--orange); padding:8px 18px; border-radius:20px; font-weight:900; cursor:pointer; }
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:3000; backdrop-filter:blur(4px); }
.modal { background:white; padding:25px; border-radius:25px; width:90%; max-width:360px; max-height:85vh; overflow-y:auto; text-align:center; }
input, select, textarea { width:100%; padding:12px; margin:8px 0; border-radius:10px; border:1px solid #ddd; }
.add-btn { width:100%; background:var(--orange); color:white; border:none; padding:15px; border-radius:15px; font-weight:800; cursor:pointer; }
.fb-btn { background:var(--fb-blue); color:white; text-decoration:none; padding:12px; border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; font-weight:bold; margin-top:15px; font-size:14px; }
</style>
</head>
<body>

<div id="gateway">
    <img src="https://raw.githubusercontent.com/ImAbbasi/my-assets/main/logo%203d.png" class="logo-3d-main">
    <div class="logo-big">PIZZA <span>MASTER</span></div>
    
    <button class="gate-btn" style="background:var(--red); color:white;" onclick="enterApp('Hot Deals 🔥')">🔥 HOT DEALS</button>
    <button class="gate-btn" style="background:white; color:black;" onclick="enterApp('Special Pizza')">BROWSE MENU</button>
    
    <a href="https://www.facebook.com/PizzaMasterLodhran" target="_blank" class="fb-btn" style="width:85%; max-width:300px; border-radius:50px; margin-top:10px;">
        Follow us on Facebook
    </a>
</div>

<div id="main-app">
    <header>
        <div class="header-logo-text">PIZZA<span>MASTER</span></div>
        <button onclick="openHistory()" style="background:var(--orange); color:white; border:none; padding:8px 12px; border-radius:20px; font-size:12px; font-weight:bold; cursor:pointer;">📜 HISTORY</button>
    </header>
    <div class="search-container">
        <input type="text" id="menuSearch" class="search-bar" placeholder="Search item..." onkeyup="filterItems()">
    </div>
    <div class="category-scroll" id="cat-tabs"></div>
    <div class="container">
        <div id="items-grid" class="grid"></div>
        <div id="no-results" style="display:none; text-align:center; padding:50px; color:#999;">No items found.</div>
    </div>
    <div id="cart-bar">
        <div><span id="cart-count">0 Items</span><br><b id="cart-total">Rs 0</b></div>
        <div class="checkout-btn" onclick="openCheckout()">CHECKOUT →</div>
    </div>
</div>

<div id="item-modal" class="overlay">
    <div class="modal">
        <h3 id="m-name" style="color:var(--red); margin:0 0 5px 0;"></h3>
        <p id="m-price-preview" style="color:var(--orange); font-weight:bold; margin-bottom:15px;"></p>
        <div id="size-selector-area"></div>
        <div style="display: flex; align-items: center; justify-content: center; background: #f0f0f0; border-radius: 8px; width: fit-content; margin: 10px auto;">
            <button onclick="changeModalQty(-1)" style="border:none; padding:10px 15px; font-weight:bold;">-</button>
            <span id="m-qty-val" style="padding:0 15px; font-weight:bold;">1</span>
            <button onclick="changeModalQty(1)" style="border:none; padding:10px 15px; font-weight:bold;">+</button>
        </div>
        <textarea id="m-note" placeholder="Special instructions..."></textarea>
        <button class="add-btn" onclick="addToCart()">ADD TO CART</button>
        <button onclick="closeModals()" style="background:none; border:none; width:100%; margin-top:10px; color:gray;">Cancel</button>
    </div>
</div>

<div id="checkout-modal" class="overlay">
    <div class="modal">
        <h3 style="margin-top:0;">Order Summary</h3>
        <div id="summary" style="text-align:left; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px; max-height:250px; overflow-y:auto;"></div>
        <input type="text" id="c-name" placeholder="Full Name">
        <input type="text" id="c-phone" placeholder="Active Sim Number">
        <select id="c-type" onchange="toggleAddressField()">
            <option value="Delivery">Delivery</option>
            <option value="Takeaway">Takeaway</option>
            <option value="Dine-In">Dine-In</option>
        </select>
        <div id="address-wrapper">
            <textarea id="c-loc" placeholder="Complete Address"></textarea>
        </div>
        <button class="add-btn" style="background:var(--green);" onclick="sendOrder()">SEND ORDER VIA WHATSAPP</button>
        <a href="https://www.facebook.com/PizzaMasterLodhran" target="_blank" class="fb-btn">Follow us on Facebook</a>
        <button onclick="closeModals()" style="background:none; border:none; width:100%; margin-top:15px; color:gray;">Back</button>
    </div>
</div>

<div id="success-modal" class="overlay">
    <div class="modal">

        <h2>Order Sent!</h2>
        <p>Opening WhatsApp...</p>
        <button class="add-btn" onclick="location.reload()">OK</button>
    </div>
</div>

    let cart = [];
    let selectedItem = null;
    let currentModalQty = 1;

    window.onload = () => {
        const saved = JSON.parse(localStorage.getItem('pizzaMasterCustomerInfo') || '{}');
        if (saved.name) document.getElementById('c-name').value = saved.name;
        if (saved.phone) document.getElementById('c-phone').value = saved.phone;
        if (saved.address) document.getElementById('c-loc').value = saved.address;
    };

    // UPGRADED SCROLL SPY LOGIC
    window.onscroll = () => {
        let sections = document.querySelectorAll('.category-heading');
        let scrollPos = window.pageYOffset || document.documentElement.scrollTop;
        sections.forEach(section => {
            if (scrollPos >= section.offsetTop - 190) {
                const catName = section.getAttribute('data-cat');
                document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                const activeTab = document.getElementById(`tab-${catName}`);
                if(activeTab) {
                    activeTab.classList.add('active');
                    activeTab.parentElement.scrollTo({ left: activeTab.offsetLeft - 40, behavior: 'smooth' });
                }
            }
        });
    };

    function enterApp(category) {
        document.getElementById('gateway').style.display = 'none';
        document.getElementById('main-app').style.display = 'block';
        renderItems();
        setTimeout(() => scrollToCategory(category), 100);
    }

    function scrollToCategory(cat) {
        const target = document.querySelector(`.category-heading[data-cat="${cat}"]`);
        if (target) window.scrollTo({ top: target.offsetTop - 180, behavior: 'smooth' });
    }

    function renderItems() {
        const grid = document.getElementById('items-grid');
        const tabs = document.getElementById('cat-tabs');
        grid.innerHTML = ''; tabs.innerHTML = '';
        Object.keys(menuData).forEach(cat => {
            const tab = document.createElement('div');
            tab.className = 'cat-tab';
            tab.id = `tab-${cat}`;
            tab.innerHTML = cat;
            tab.onclick = () => scrollToCategory(cat);
            tabs.appendChild(tab);

            const heading = document.createElement('h2');
            heading.className = 'category-heading';
            heading.setAttribute('data-cat', cat);
            heading.style = "grid-column: 1 / -1; margin: 20px 0; color: var(--red); border-left: 5px solid var(--orange); padding-left:10px; font-size:18px;";
            heading.innerText = cat;
            grid.appendChild(heading);

            menuData[cat].items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${item.img}" class="card-img">
                    <div class="card-info">
                        <div class="card-name">${item.name}</div>
                        <span class="card-price">Rs ${typeof item.price === 'object' ? Object.values(item.price)[0] : item.price}</span><br>
                        <button class="add-btn" style="padding:5px; margin-top:5px;" onclick='openItem(${JSON.stringify(item)})'>ADD</button>
                    </div>`;
                grid.appendChild(card);
            });
        });
    }

    function openItem(item) {
        selectedItem = item; 
        currentModalQty = 1;
        document.getElementById('m-name').innerText = item.name;
        document.getElementById('m-qty-val').innerText = currentModalQty;
        document.getElementById('m-note').value = "";
        const area = document.getElementById('size-selector-area');
        area.innerHTML = '';
        if (typeof item.price === 'object') {
            Object.entries(item.price).forEach(([s, p], i) => {
                area.innerHTML += `<label><input type="radio" name="msize" value="${s}" data-p="${p}" ${i==0?'checked':''} onchange="updateModalPrice()"> ${s} - Rs ${p}</label><br>`;
            });
        }
        updateModalPrice();
        document.getElementById('item-modal').style.display = 'flex';
    }

    function updateModalPrice() {
        let p = typeof selectedItem.price === 'object' ? parseInt(document.querySelector('input[name="msize"]:checked').getAttribute('data-p')) : selectedItem.price;
        document.getElementById('m-price-preview').innerText = `Rs ${p * currentModalQty}`;
    }

    function changeModalQty(a) { 
        currentModalQty = Math.max(1, currentModalQty + a); 
        document.getElementById('m-qty-val').innerText = currentModalQty; 
        updateModalPrice(); 
    }

    function addToCart() {
        let p = 0, sz = "";
        if (typeof selectedItem.price === 'object') {
            const sel = document.querySelector('input[name="msize"]:checked');
            p = parseInt(sel.getAttribute('data-p')); 
            sz = " ("+sel.value+")";
        } else { p = selectedItem.price; }
        
        cart.push({ 
            name: selectedItem.name + sz, 
            price: p, 
            qty: currentModalQty, 
            note: document.getElementById('m-note').value, 
            total: p * currentModalQty 
        });
        closeModals(); 
        updateCart();
    }

    function updateCart() {
        const count = cart.reduce((s, i) => s + i.qty, 0);
        const total = cart.reduce((s, i) => s + i.total, 0);
        document.getElementById('cart-bar').style.display = count > 0 ? 'flex' : 'none';
        document.getElementById('cart-count').innerText = count + " Items";
        document.getElementById('cart-total').innerText = "Rs " + total;
    }

    function removeFromCart(index) {
        cart.splice(index, 1);
        updateCart();
        openCheckout();
    }

    function updateCartItemQty(index, change) {
        cart[index].qty = Math.max(1, cart[index].qty + change);
        cart[index].total = cart[index].qty * cart[index].price;
        updateCart();
        openCheckout();
    }

    function openCheckout() {
        if (cart.length === 0) { closeModals(); return; }
        const sum = document.getElementById('summary');
        sum.innerHTML = cart.map((i, index) => `
            <div style="border-bottom:1px solid #f0f0f0; padding:10px 0;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="text-align:left;">
                        <strong>${i.name}</strong><br>
                        <small>${i.note ? 'Note: ' + i.note : ''}</small><br>
                        <span style="color:var(--orange)">Rs ${i.total}</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <button onclick="updateCartItemQty(${index}, -1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #ccc;">-</button>
                        <span>${i.qty}</span>
                        <button onclick="updateCartItemQty(${index}, 1)" style="width:25px; height:25px; border-radius:50%; border:1px solid #ccc;">+</button>
                        <button onclick="removeFromCart(${index})" style="color:red; background:none; border:none; margin-left:5px;">✕</button>
                    </div>
                </div>
            </div>
        `).join('');
        document.getElementById('checkout-modal').style.display = 'flex';
    }

    function toggleAddressField() {
        const type = document.getElementById('c-type').value;
        document.getElementById('address-wrapper').style.display = type === 'Delivery' ? 'block' : 'none';
    }

    function closeModals() {
        document.querySelectorAll('.overlay').forEach(m => m.style.display = 'none');
    }

    function sendOrder() {
    const n = document.getElementById('c-name').value.trim();
    const l = document.getElementById('c-loc').value.trim();
    const p = document.getElementById('c-phone').value.trim();
    const type = document.getElementById('c-type').value;

    // 1. Validation
    if(!n || !p || (type === "Delivery" && !l)) {
        return alert("Please fill all details!");
    }

    // 2. Save Customer Info for next time
    localStorage.setItem('pizzaMasterCustomerInfo', JSON.stringify({
        name: n,
        phone: p,
        address: type === "Delivery" ? l : ''
    }));

    // 3. Build WhatsApp Message
    let typeIcon = type === "Delivery" ? "🚚" : (type === "Takeaway" ? "🛍️" : "🍽️");
    let msg = "🍕 *PIZZA MASTER | NEW ORDER*\n--------------------------\n";
    msg += "👤 *CUSTOMER DETAILS*\n*Name:* " + n + "\n*Phone:* " + p + "\n*Type:* " + typeIcon + " " + type + "\n";
    if(type === "Delivery") msg += "*Address:* " + l + "\n";
    msg += "\n🛒 *ORDER ITEMS*\n--------------------------\n";
    
    cart.forEach(i => {
        msg += "• " + i.qty + "x " + i.name + " = Rs " + (i.price * i.qty) + "\n";
        if(i.note) msg += " └ _Note: " + i.note + "_\n";
    });
    
    msg += "--------------------------\n💰 *BILL TOTAL: " + document.getElementById('cart-total').innerText + "*\n--------------------------\n\n👨‍🍳 *Thanks for being part of the Pizza Master family!*";

    // 4. Visual Feedback
    const orderBtn = document.querySelector('#checkout-modal .add-btn');
    const originalBtnText = orderBtn.innerText;
    orderBtn.innerText = "Processing...";
    orderBtn.disabled = true;

    // 5. Save to Order History
    const newOrder = {
        id: Date.now(),
        date: new Date().toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short' }),
        name: n,
        type: type,
        total: document.getElementById('cart-total').innerText,
        items: cart.map(item => ({ name: item.name, qty: item.qty }))
    };

    let history = JSON.parse(localStorage.getItem('pizzaMasterHistory') || '[]');
    history.unshift(newOrder); // Add new order to top of list
    localStorage.setItem('pizzaMasterHistory', JSON.stringify(history.slice(0, 10))); // Keep last 10 orders

    // 6. Launch WhatsApp & Reset
    setTimeout(() => {
        window.open("https://wa.me/923156838383?text=" + encodeURIComponent(msg), '_blank');
        
        // Show success modal
        closeModals();
        document.getElementById('success-modal').style.display = 'flex';
        
        // Reset button for UI consistency
        orderBtn.innerText = originalBtnText;
        orderBtn.disabled = false;
    }, 800);
}

    function openHistory() {
        const history = JSON.parse(localStorage.getItem('orderHistory') || '[]');
        let html = history.length === 0 ? '<p>No previous orders found.</p>' : '';
        history.forEach(h => {
            html += `<div style="text-align:left; border-bottom:1px solid #eee; padding:10px;">
                        <small>${h.date}</small><br>
                        <b>${h.items} Items - Rs ${h.total}</b>
                     </div>`;
        });
        
        // Using checkout modal to display history for simplicity
        const sum = document.getElementById('summary');
        sum.innerHTML = `<h3>Recent Orders</h3>` + html;
        document.getElementById('checkout-modal').style.display = 'flex';
        // Hide order fields when viewing history
        document.querySelectorAll('#checkout-modal input, #checkout-modal select, #checkout-modal textarea, #checkout-modal .add-btn').forEach(el => el.style.display = 'none');
        // Add a button to return to cart if needed
        const backBtn = document.createElement('button');
        backBtn.innerText = "Close History";
        backBtn.className = "add-btn";
        backBtn.onclick = () => { location.reload(); };
        sum.appendChild(backBtn);
    }
</script>
